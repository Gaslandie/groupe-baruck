name: Deploy to Bluehost

# À chaque push sur main : construit le site pour groupebaruck.com et envoie par FTP
# le site et le back-office, chacun avec un compte FTP cPanel enfermé dans son dossier
# (groupebaruck.com et baruck-admin). Secrets GitHub : FTP_SERVER, SITE_FTP_USERNAME,
# SITE_FTP_PASSWORD, ADMIN_FTP_USERNAME, ADMIN_FTP_PASSWORD. Sans eux, l'envoi est ignoré.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluehost
  cancel-in-progress: true

env:
  SITE_DOMAIN: groupebaruck.com
  ADMIN_DOMAIN: admin.groupebaruck.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the site for the client domain
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ env.SITE_DOMAIN }}/
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_AUDIENCE_URL: https://${{ env.ADMIN_DOMAIN }}/collect.php
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      - name: Package the back office
        run: npm run backoffice:package
      - name: Assemble the files to send
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/site
          cp -R out/. dist/site/ && rm -f dist/site/.nojekyll
          escaped="${SITE_DOMAIN//./\\\\.}"
          sed -e "s/__SITE_DOMAIN_RE__/$escaped/g" -e "s/__SITE_DOMAIN__/$SITE_DOMAIN/g" deploy/site.htaccess > dist/site/.htaccess
          if ! curl -s -o /dev/null -m 20 "https://$SITE_DOMAIN/"; then
            sed -i '/# >>> https/,/# <<< https/d' dist/site/.htaccess
            echo "::warning::HTTPS ne répond pas sur $SITE_DOMAIN : redirection HTTPS omise, relancer ce workflow une fois le certificat actif."
          fi
          tar -xzf backoffice/dist/baruck-backoffice-bluehost.tar.gz -C dist backoffice
          test -f dist/site/index.html && test -f dist/site/404.html && test -f dist/backoffice/public/index.php
          ! grep -rl 'gaslandie.github.io' dist/site
          echo "deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ') commit=${GITHUB_SHA}" > dist/site/deploy-check.txt
          du -sh dist/site dist/backoffice
      - name: Send the site (FTP account limited to groupebaruck.com)
        if: env.SITE_FTP_PASSWORD != ''
        env:
          SITE_FTP_PASSWORD: ${{ secrets.SITE_FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.SITE_FTP_USERNAME }}
          password: ${{ secrets.SITE_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/site/
          server-dir: /
          exclude: |
            .well-known/**
            cgi-bin/**
      - name: Send the back office (FTP account limited to baruck-admin)
        if: env.ADMIN_FTP_PASSWORD != ''
        env:
          ADMIN_FTP_PASSWORD: ${{ secrets.ADMIN_FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.ADMIN_FTP_USERNAME }}
          password: ${{ secrets.ADMIN_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/backoffice/
          server-dir: /
          exclude: |
            config.local.php
            storage/**
      - name: Check the site online
        if: env.SITE_FTP_PASSWORD != ''
        env:
          SITE_FTP_PASSWORD: ${{ secrets.SITE_FTP_PASSWORD }}
        run: |
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "http://$SITE_DOMAIN/deploy-check.txt" || true)
          echo "deploy-check.txt : HTTP $code"
          curl -s -m 30 "http://$SITE_DOMAIN/deploy-check.txt" || true
