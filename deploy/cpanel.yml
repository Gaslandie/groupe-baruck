---
# Déploiement par « Git Version Control » de cPanel (branche bluehost, générée par GitHub Actions).
# Dans cPanel : Git Version Control → Manage → Pull or Deploy → Update from Remote, puis Deploy HEAD Commit.
# Les chemins sont ceux du compte fnksrwmy ; SITE doit être le Document Root de groupebaruck.com.
deployment:
  tasks:
    - export SITE=/home2/fnksrwmy/groupebaruck.com ADMIN=/home2/fnksrwmy/baruck-admin BACKUPS=/home2/fnksrwmy/baruck-backups
    - /bin/mkdir -p "$SITE" "$ADMIN" "$BACKUPS"
    - /bin/tar -czf "$BACKUPS/site-$(date +%Y%m%d-%H%M%S).tar.gz" -C "$SITE" . && ls -t "$BACKUPS"/site-*.tar.gz | tail -n +6 | xargs -r rm -f
    - /usr/bin/rsync -a --delete --exclude=.well-known/ --exclude=cgi-bin/ --exclude=error_log site/ "$SITE/"
    - /usr/bin/rsync -a --delete --exclude=config.local.php --exclude=storage/ backoffice/ "$ADMIN/"
    - PHP=$(ls /opt/cpanel/ea-php8[2-9]/root/usr/bin/php 2>/dev/null | tail -1); if [ -f "$ADMIN/config.local.php" ]; then cd "$ADMIN" && "${PHP:-php}" bin/install.php init; else echo "config.local.php absent : installation du back-office ignorée"; fi
